name: Apply Supabase migrations

# מריץ את קובצי supabase/migrations/ מול ה-DB בסדר שמות.
# דורש secret בשם SUPABASE_DB_URL — חובה מחרוזת של ה-SESSION POOLER
# (Connect → Session pooler; host: *.pooler.supabase.com, פורט 5432). זה IPv4.
# אין להשתמש בחיבור הישיר (db.<ref>.supabase.co) — הוא IPv6-only ו-runners של
# GitHub Actions נכשלים עליו עם "Network is unreachable".
# בסיסמה: רק תווים שיש להם משמעות ב-URI חייבים percent-encoding — @ : / ? # % & +
# ורווח. תווים כמו ! ~ * ' ( ) מותרים כמו שהם (libpq גם מפענח %21 בחזרה ל-!, אז
# שתי הצורות עובדות). ההנחיה הקודמת כאן דרשה לקודד הכול, וזה שלח לחפש תקלה
# בסיסמה במקום בכתובת — שהיא הדבר שבאמת נכשל.
# בלי ה-secret הזה יש להריץ את קובצי ה-SQL ידנית ב-SQL Editor של Supabase.

# **ידני בלבד.** ההחלה בפועל חיה כשלב בתוך deploy.yml, כי שני workflows על אותו
# commit מתחרים: הקוד יכול לעלות לפני העמודה שהוא קורא. מה שנשאר כאן הוא
# השליפה הידנית — להריץ את הקבצים בלי לפרוס, כשמתקנים מסד שיצא מסנכרון.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations with psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            # נכשל, לא מזהיר-ויוצא-0. מישהו הפעיל את זה **כדי** להחיל מיגרציות;
            # check ירוק שלא החיל דבר הוא בדיוק התשובה שאסור לתת לו.
            echo "::error::SUPABASE_DB_URL secret is not set — nothing was applied."
            echo "Run the SQL files in supabase/migrations/ manually in the Supabase SQL Editor,"
            echo "or add a SUPABASE_DB_URL secret to enable automatic migration."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
