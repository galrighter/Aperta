name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  # לא מבטלים דיפלוי שרץ: הביטול יכול ליפול בין פריסת forme-frame לפריסת
  # forme-studio ולהשאיר את השניים בגרסאות שונות — בדיוק מה שהסדר למטה מונע.
  # דחיפה חדשה ממתינה בתור במקום לקטוע.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ההיסטוריה נדרשת כדי לדעת אם הדחיפה הזו נגעה במיגרציות. ב-checkout
          # רדוד ה-commit הקודם לא קיים, והבדיקה הייתה נופלת חזרה ל"אין שינוי"
          # — כלומר עוברת בשקט בדיוק במקרה שהיא נועדה לתפוס.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # שער בטיחות: פריסה נחסמת אם הטייפים או הטסטים נכשלים. עד כה הדיפלוי רץ
      # על push ל-main בלי קשר ל-CI, כך ש-commit אדום יכול היה לעלות לאוויר.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (OpenNext for Cloudflare)
        # NEXT_PUBLIC_* נצרבים לתוך ה-JS בזמן הבילד, ולכן הם `env` על השלב הזה
        # ולא סודות של ה-Worker: ב-secrets.json הם לא היו משפיעים על כלום,
        # והכניסה הייתה נראית שבורה בלי שום שגיאה שמסבירה למה.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx opennextjs-cloudflare build
      # שער על המשתנים שנושאים את שם הדומיין.
      #
      # עד כאן לכל אחד מהם הייתה נפילה-לברירת-מחדל עם `rmjewel.com` כתוב בתוכה.
      # זה עובד — בדיוק עד להחלפת הדומיין, שהיא הרגע שבו משתנה שנשכח מחזיר את
      # הדומיין הישן לפרודקשן בלי מילה. עדיף דיפלוי שנעצר ואומר מה חסר.
      # (המודלים למטה נשארים עם ברירת מחדל: הם לא נוגעים בדומיין.)
      - name: Check the domain-bearing variables are set
        env:
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          VECTORIZER_URL: ${{ vars.VECTORIZER_URL }}
        run: |
          set -euo pipefail
          missing=""
          for name in MAIL_FROM MAIL_TO VECTORIZER_URL; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            echo "They used to fall back to rmjewel.com, which is the one value a domain switch must never silently restore."
            exit 1
          fi

      # המיגרציות רצות כאן, ולא ב-workflow משלהן. שני workflows על אותו commit
      # מתחרים: הקוד יכול לעלות לפני העמודה שהוא קורא, והחלון הזה כבר הפיל
      # קריאה *וכתיבה* ליומן ההרצות. שלב באותו job הוא היחיד שמבטיח סדר.
      #
      # אחרי הטסטים ולפני הפריסה: אין טעם לגעת במסד עבור commit אדום, ואין טעם
      # לפרוס קוד שהעמודה שלו טרם קיימת.
      #
      # ההרצה חוזרת על כל הקבצים בכל פעם ונשענת על כך שהם idempotent (ראה
      # migrate.yml, שנשאר כשלוף ידני).
      - name: Apply database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            # חסר ה-secret. אם הדחיפה הזו לא נגעה במיגרציות, אין מה להחיל וזו
            # רק אזהרה. אם היא כן — עצירה: check ירוק על קוד שדורש עמודה שלא
            # נוצרה הוא בדיוק הכשל השקט שהסידור הזה בא לסגור.
            changed=""
            if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/migrations || true)
            fi
            if [ -n "$changed" ]; then
              echo "::error::SUPABASE_DB_URL is not set and this push changes migrations:"
              echo "$changed"
              exit 1
            fi
            echo "::warning::SUPABASE_DB_URL is not set — no migrations applied (none changed here)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Push runtime secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/secrets.json <<EOF
          {
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "OPENAI_KEY": "${{ secrets.OPENAI_KEY }}",
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_SECRET_KEY": "${{ secrets.SUPABASE_SECRET_KEY }}",
            "ADMIN_TOKEN": "${{ secrets.ADMIN_TOKEN }}",
            "RESEND_API": "${{ secrets.RESEND_API }}",
            "MAIL_FROM": "${{ vars.MAIL_FROM }}",
            "MAIL_TO": "${{ vars.MAIL_TO }}",
            "ALERT_TO": "${{ vars.ALERT_TO || vars.MAIL_TO }}",
            "LLM_MODEL": "${{ vars.LLM_MODEL || 'claude-sonnet-4-6' }}",
            "OPENAI_MODEL": "${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}",
            "LLM_PROVIDER": "${{ vars.LLM_PROVIDER || 'openai' }}",
            "VECTORIZER_URL": "${{ vars.VECTORIZER_URL }}",
            "VECTORIZER_TOKEN": "${{ secrets.VECTORIZER_TOKEN }}"
          }
          EOF
          npx wrangler versions secret bulk /tmp/secrets.json || npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
      # קודם ה-Worker של המסגור, אחר כך האתר שקשור אליו. הסדר הזה הוא תנאי:
      # פריסה של forme-studio עם service binding ל-forme-frame נכשלת אם הוא לא
      # קיים. הוא לא נושא סודות ולא חשוף לאינטרנט — רק את מנוע הגיאומטריה.
      #
      # שניהם נפרסים מאותו commit בכל דיפלוי, וזה חייב להישאר כך: forme-frame
      # ישן מריץ חוקי ייצור ישנים על מה שהאתר החדש שולח לו.
      - name: Deploy the framing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.frame.jsonc

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
