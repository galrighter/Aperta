name: Backup database

# גיבוי יומי של מסד הנתונים.
#
# **למה זה הקובץ החשוב ביותר בתיקייה הזאת.** עד 15.8 לא היה שום גיבוי: Supabase
# על התוכנית החינמית לא שומר גיבויים ואין בה PITR, ו-`deploy.yml` מריץ את **כל**
# קובצי המיגרציה מחדש בכל פריסה בהסתמך על אידמפוטנטיות. כתיבה לא-אידמפוטנטית
# אחת, מחיקה בטעות ב-SQL Editor, או פרויקט שנמחק — וכל העיצובים, הגרסאות
# (כולל ה-SVG שנחתך), ההזמנות והמשתמשים נעלמים בלי דרך חזרה. זו הייתה נקודת
# האל-חזור היחידה בעסק (docs/FULL_AUDIT_2026-08.md, פרק 7, ממצא 1).
#
# **מה מגובה ומה לא.** ה-dump מכסה את כל הסכימה `public`, כלומר גם את
# `design_versions.svg` — קובץ החיתוך עצמו יושב במסד ולא ב-storage. מה שלא
# מכוסה: קבצי Storage (‏PNG של סימונים ותמונות שיתוף), שהם משניים וניתנים
# ליצירה מחדש, ו-`auth.users` של Supabase שאינה בסכימה הזאת — כניסה מחדש
# במייל תיצור אותה שוב, והקישור לפרופיל נשמר לפי מייל.
#
# **לאן זה נשמר.** שני מקומות, בסדר הזה:
#   1. **‏`/var/backups/aperta/` בשרת ה-Hetzner** — היעד הראשי, 90 יום.
#   2. **‏artifact של הריצה** — עותק שני, שבוע, ורק כשהקובץ מוצפן.
#
# הסדר הזה אינו שרירותי: **הריפו ציבורי**, ו-artifact בריפו ציבורי ניתן
# להורדה בידי כל בעל חשבון GitHub. ‏dump שמכיל שמות, מיילים, טלפונים וכתובות
# של לקוחות אינו דבר שההגנה היחידה עליו היא הצפנה. השרת שלנו, לעומת זאת, הוא
# גם פרטי, גם עם מקום בשפע, וגם בלתי תלוי ב-Supabase — כלומר הוא עומד בדיוק
# בתרחיש שהגיבוי נועד לו.
#
# **מה שנדרש להגדיר:** `SUPABASE_DB_URL` (אותו secret שהמיגרציות משתמשות בו —
# חובה מחרוזת ה-Session pooler; ראו migrate.yml), ‏`HETZNER_SSH`/`HETZNER_HOST`/
# `HETZNER_USER` (אותם של deploy-vectorizer.yml), ו-`BACKUP_PASSPHRASE`
# להצפנה. בלי הסיסמה הגיבוי עדיין רץ ונשלח ל-Hetzner, אבל לא נשמר כ-artifact.
#
# **השחזור** — docs/RUNBOOK_RESTORE.md. runbook נכתב ביום רגוע, לא בזמן אמת.

on:
  schedule:
    # 02:41 UTC ≈ 05:41 בישראל. `schedule` ב-Actions מאחר בעשרות דקות
    # (נמדד: 40–95), וזה לא משנה לגיבוי — מה שנמדד בימים לא נמדד בדקות.
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install a matching pg_dump
        run: |
          set -euo pipefail
          # ‏pg_dump מסרב לגבות שרת בגרסה גבוהה משלו, ולכן צריך לקוח חדש
          # מספיק — לא זה שמגיע עם ה-runner.
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq

          # הגרסה הגבוהה ש-pgdg מציע, ולא מספר קשיח: ביום ש-Supabase יעלה
          # ל-18, קוד שמתקין 17 ייכשל בדיוק כמו שהוא נכשל היום מול 17.
          newest=$(apt-cache search --names-only '^postgresql-client-[0-9]+$' \
            | awk '{print $1}' | sed 's/.*-//' | sort -n | tail -1)
          [ -n "$newest" ] || { echo "::error::no postgresql-client package found in pgdg"; exit 1; }
          sudo apt-get install -y -qq "postgresql-client-$newest"

          # **הנתיב המלא, לא `pg_dump`.** ‏`/usr/bin/pg_dump` באובונטו הוא
          # עטיפה (pg_wrapper) שבוחרת את גרסת **ברירת המחדל של ההפצה** — 16
          # ב-24.04 — ולא את הגבוהה שמותקנת. זה מה שהפיל את הגיבוי הראשון
          # (16.8, run 31924411198): הלוג הראה "Setting up postgresql-client-17"
          # ומיד אחריו "pg_dump (PostgreSQL) 16.14", ואז
          # "aborting because of server version mismatch — server 17.6".
          echo "PGBIN=/usr/lib/postgresql/$newest/bin" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/$newest/bin/pg_dump" --version

      - name: Dump the public schema
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            # נכשל ולא "מזהיר ויוצא 0". check ירוק על גיבוי שלא קרה הוא
            # בדיוק האשליה שהגיבוי נועד למנוע.
            echo "::error::SUPABASE_DB_URL secret is not set — nothing was backed up."
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d)
          file="aperta-db-$stamp.sql.gz"
          # ‏--no-owner/--no-privileges: השחזור נעשה לפרויקט אחר, עם תפקידים
          # אחרים. ‏--schema=public: ‏auth/storage מנוהלות ע"י Supabase ואי
          # אפשר לשחזר אותן ככה ממילא.
          "$PGBIN/pg_dump" "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > "$file"

          # שפיות: dump ריק הוא הכישלון השקט הקלאסי — הקובץ קיים, הריצה ירוקה,
          # ואין בו כלום. שלוש הטבלאות שבלעדיהן אין עסק חייבות להופיע.
          for t in designs design_versions orders; do
            zgrep -q "CREATE TABLE public.$t" "$file" \
              || { echo "::error::dump is missing table $t"; exit 1; }
          done
          bytes=$(stat -c%s "$file")
          echo "dump size: $bytes bytes"
          [ "$bytes" -gt 4096 ] || { echo "::error::dump is suspiciously small"; exit 1; }

          if [ -n "$PASSPHRASE" ]; then
            gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" -o "$file.gpg" "$file"
            rm -f "$file"
            echo "artifact=$file.gpg" >> "$GITHUB_OUTPUT"
            echo "encrypted=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BACKUP_PASSPHRASE is not set — the dump holds customer names, emails, phones and addresses. It will be sent to Hetzner but NOT kept as a run artifact (this repository is public)."
            echo "artifact=$file" >> "$GITHUB_OUTPUT"
            echo "encrypted=no" >> "$GITHUB_OUTPUT"
          fi

      # ===== היעד הראשי: השרת ב-Hetzner =====
      #
      # **למה לא GitHub כיעד ראשי.** הריפו הזה **ציבורי**, ו-artifact של ריצה
      # בריפו ציבורי ניתן להורדה בידי כל מי שמחזיק חשבון GitHub. גיבוי מסד
      # שמכיל שמות, מיילים, טלפונים וכתובות של לקוחות אינו דבר שמניחים שם —
      # ההצפנה היא מה שמפריד בין "artifact" לבין "דלף", והיא לא אמורה להיות
      # ההגנה היחידה. השרת ב-Hetzner הוא שלנו, יש בו מקום בשפע, והוא בלתי
      # תלוי ב-Supabase — כלומר הוא עומד בדיוק בתרחיש שהגיבוי נועד לו.
      #
      # אותם ארבעה secrets שהפריסה כבר משתמשת בהם (deploy-vectorizer.yml).
      - name: Ship it to Hetzner
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_PORT }}
          FILE: ${{ steps.dump.outputs.artifact }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${USER:-}" ]; then
            # היעד הראשי. חסר = אין גיבוי, ולכן זו שגיאה ולא דילוג.
            echo "::error::HETZNER_SSH/HOST/USER are not set — the backup has nowhere to go."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/backup_key"
          chmod 600 "$HOME/.ssh/backup_key"
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          SSH="ssh -i $HOME/.ssh/backup_key -p ${PORT:-22} -o StrictHostKeyChecking=yes"

          $SSH "$USER@$HOST" 'mkdir -p /var/backups/aperta && chmod 700 /var/backups/aperta'
          scp -i "$HOME/.ssh/backup_key" -P "${PORT:-22}" "$FILE" "$USER@$HOST:/var/backups/aperta/"

          # **מוודאים שמה שהגיע זהה למה שנשלח.** העברה שנקטעה משאירה קובץ
          # בגודל סביר שנראה כמו גיבוי — וזה בדיוק סוג הגיבוי שמתגלה כריק
          # ביום שצריך אותו.
          local_sum=$(sha256sum "$FILE" | awk '{print $1}')
          remote_sum=$($SSH "$USER@$HOST" "sha256sum /var/backups/aperta/$(basename "$FILE") | awk '{print \$1}'")
          [ "$local_sum" = "$remote_sum" ] \
            || { echo "::error::checksum mismatch after transfer"; exit 1; }
          echo "stored on Hetzner: /var/backups/aperta/$(basename "$FILE")  sha256=$local_sum"

          # ניקוי מעל 90 יום. שלושה חודשים ולא שלושים יום כמו ב-artifact:
          # כאן המקום זול, ותקלה שמתגלה מאוחר היא בדיוק זו שאין לה גיבוי.
          $SSH "$USER@$HOST" 'find /var/backups/aperta -name "aperta-db-*" -mtime +90 -delete'
          $SSH "$USER@$HOST" 'ls -lh /var/backups/aperta | tail -5; df -h /var | tail -1'

      # ===== היעד המשני: artifact של הריצה =====
      #
      # שני מקומות ולא אחד — אבל רק כשהקובץ מוצפן. ראו הנימוק למעלה: הריפו
      # ציבורי. בלי הצפנה הצעד הזה מדלג, והגיבוי חי ב-Hetzner בלבד.
      - name: Keep a second copy as a run artifact
        if: steps.dump.outputs.encrypted == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ steps.dump.outputs.artifact }}
          # שבוע, ולא חודש: זה עותק שני לשליפה מהירה, וההיסטוריה יושבת
          # ב-Hetzner. גם עותק מוצפן בריפו ציבורי אינו דבר להשאיר בו לחודשיים.
          retention-days: 7
          if-no-files-found: error

      # ההתראה היא חצי מהעניין: גיבוי שנשבר בשקט הוא בדיוק היעדר גיבוי, רק עם
      # תחושת ביטחון. מייל הכישלון של GitHub מגיע לתיבה שמתמלאת; טלגרם לא.
      - name: Alert on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || vars.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "telegram not configured — skipping alert"
            exit 0
          fi
          curl -sS --max-time 30 -X POST \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=⚠️ גיבוי המסד נכשל. אין גיבוי להיום. $RUN_URL" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
