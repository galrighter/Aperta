name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The vectorizer is Python and its own package, so it gets its own job rather
  # than bolting pip installs onto the Node one — they can also run in parallel.
  vectorizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vectorizer/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  # Workflow שאינו YAML תקין אינו נכשל — הוא **לא רץ**. GitHub פותח עליו ריצה
  # ריקה (0 jobs) עם איקס אדום, וזה נראה כמו עוד check שנכשל ולא כמו workflow
  # שאינו קיים. כך `undici-override-check` שתק שלושה חודשים: heredoc שגופו
  # התחיל בעמודה 0 סגר את ה-block scalar של `run: |` בטרם עת, והבדיקה החודשית
  # שהוא נועד להריץ פשוט לא רצה — כולל התזכורת שהיא הייתה אמורה לפתוח.
  #
  # הצעד הזה נותן לזה קול בתוך CI עצמו, שהוא **כן** נטען: הוא מדפיס את הקובץ
  # ואת השורה, ולא איקס בלי גוף.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyYAML אינו חלק מהפייתון של ה-runner. הבדיקה עברה במחשב שבו הוא מותקן
      # ונפלה כאן על ImportError — כלומר בדיוק הרעש שהיא באה להסיר: איקס אדום
      # שאינו אומר דבר על הקוד.
      - run: pip install --quiet pyyaml
      - name: Every workflow file parses
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.y*ml")):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: {e}")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY

  test:
    runs-on: ubuntu-latest
    # ריצה תקועה אינה נכשלת מעצמה: ברירת המחדל של GitHub היא **שש שעות**, וזה
    # מה שקרה כאן — ‏`playwright install` נתקע (ראה למטה), וגם ה-job הזה וגם זה
    # של main נשארו `in_progress` שעות. איקס אדום אחרי 20 דקות הוא מידע; עיגול
    # מסתובב אינו. הריצות שהצליחו עד כה נמשכו 3–6 דקות בסך הכול, כלומר התקרה
    # רחוקה מלהפריע גם ל-runner איטי.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # עד כאן lint לא רץ בשום מקום — לא היה קובץ קונפיג, והפקודה נעצרה על
      # שאלה אינטראקטיבית. עכשיו יש (eslint.config.mjs), והוא נקי.
      - run: npm run lint
      - name: Install ezdxf for DXF round-trip test
        run: pip install ezdxf
      - run: npm test
      - run: npm run build
      # שער הנגישות. הוא רץ אחרי ה-build כי הוא סורק את הבילד עצמו: מרים
      # `next start`, קורא את רשימת הנתיבים מ-sitemap.xml ומריץ axe על כל אחד
      # בשתי רזולוציות. עמוד ציבורי חדש נכנס לסריקה מרגע שהוא ב-sitemap, בלי
      # שאיש יזכור לרשום אותו במקום שני.
      #
      # ⚠ **`--with-deps` ירד (18.8), אחרי שהצעד הזה נתקע.** הוא מריץ
      # `apt-get install` תחת sudo כדי להתקין את ספריות המערכת של הדפדפן,
      # ותמונת `ubuntu-latest` כבר נושאת אותן — כלומר ברוב הזמן הוא עבד קשה
      # בשביל כלום, ובפעם שבה משהו ב-apt נתקע (מראה איטית, מבקש אינטראקטיבי)
      # הוא לקח איתו את כל ה-job. מה שנמדד: כל השערים שנוגעים לקוד עברו —
      # ‏`tsc` ‏12 שנ׳, `lint` ‏15, `npm test` ‏25, `build` ‏25 — והצעד הזה נשאר
      # תקוע שעות, גם על main (ריצה 32172759112, ‏18.8) וגם על ענף.
      #
      # אם יתברר שספרייה כן חסרה, זה ייפול כאן בשנייה הראשונה של הסריקה עם
      # שם הספרייה בשגיאה — כשל שאומר מה לעשות, ולא תקיעה שאינה אומרת דבר.
      # תקרה משלו כדי שיהיה ברור **מי** נתקע, ולא רק שה-job נגמר בזמן.
      - name: Install Chromium for the accessibility scan
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run test:a11y
