name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The vectorizer is Python and its own package, so it gets its own job rather
  # than bolting pip installs onto the Node one — they can also run in parallel.
  vectorizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vectorizer/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # עד כאן lint לא רץ בשום מקום — לא היה קובץ קונפיג, והפקודה נעצרה על
      # שאלה אינטראקטיבית. עכשיו יש (eslint.config.mjs), והוא נקי.
      - run: npm run lint
      - name: Install ezdxf for DXF round-trip test
        run: pip install ezdxf
      - run: npm test
      - run: npm run build
      # שער הנגישות. הוא רץ אחרי ה-build כי הוא סורק את הבילד עצמו: מרים
      # `next start`, קורא את רשימת הנתיבים מ-sitemap.xml ומריץ axe על כל אחד
      # בשתי רזולוציות. עמוד ציבורי חדש נכנס לסריקה מרגע שהוא ב-sitemap, בלי
      # שאיש יזכור לרשום אותו במקום שני.
      #
      - name: Install Chromium for the accessibility scan
        run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
