name: Sweep stalled generations (manual)

# מסיים הרצות יצירה שנתקעו — בלי שהלקוחה תמתין להן ובלי שדפדפן כלשהו יהיה
# פתוח. ההחלטות כולן בשרת (`src/lib/runs/sweep.ts`); כאן רק הדק.
#
# **התזמון כבר לא כאן.** הוא עבר ל-Cron Trigger של Cloudflare
# (`wrangler.jsonc` → `triggers.crons`, והמתזמן ב-`worker-entry.js`). הנימוק
# שעמד כאן — ש-`schedule` ב-Actions הוא best-effort ו"יכול לאחר בדקות" — נמדד
# ב-13.8 והתברר כאופטימי בסדר גודל: 12 ההרצות האחרונות היו במרווחים של 50 עד
# 108 דקות, כלומר `*/10` נמסר כפעם בשעה. GitHub מווסת `schedule` בתדירות
# גבוהה. המחיר היה לקוח שישב 11.5 דקות מול מסך טעינה על הרצה שהייתה כשירה
# לאיסוף אחרי שש, ושהושלמה בסוף רק בלחיצה ידנית.
#
# מה שנשאר כאן הוא ההרצה הידנית: כפתור "סרוק עכשיו" שאינו דורש גישה ל-Cloudflare
# ולא המתנה לסבב הבא. אותו שער, אותו secret, אותה תשובה ביומן.
#
# **מה נדרש להגדיר: כלום.** `ADMIN_TOKEN` הוא אותו secret שהפריסה כבר משתמשת
# בו (deploy.yml דוחף אותו ל-Worker), והכתובת אינה סוד — היא הדומיין הקנוני,
# שיושב בקוד (`SITE.url`) וב-wrangler.jsonc. לכן היא ברירת מחדל כאן, וניתנת
# לדריסה דרך `vars.SITE_URL` אם אי פעם תרוץ סריקה מול סביבה אחרת.
#
# מה שכן נשאר קשיח: בלי `ADMIN_TOKEN` ה-workflow **נכשל** ואומר מה חסר. הוא
# מריץ עבודה שעולה כסף, ו-check ירוק על סריקה שלא קרתה הוא בדיוק התשובה שאסור
# לתת.

on:
  workflow_dispatch:

# סריקות במקביל היו נוגעות באותן שורות. אין בכך נזק — הסגירה מותנית ב-running,
# ולכן רק אחת מסיימת כל הרצה — אבל זו עבודה כפולה שעולה כסף אצל ספק התמונות.
concurrency:
  group: sweep-stalled-generations
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the sweep
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aperta-designs.com' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN secret is not set — nothing was swept."
            exit 1
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "authorization: Bearer $ADMIN_TOKEN" \
            --max-time 300 \
            "$SITE_URL/api/jobs/sweep")
          cat body.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Sweep returned HTTP $code"
            exit 1
          fi
