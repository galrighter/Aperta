name: Story lab

# הרצת כיול של מסלול Story — כמה סיפורים, ברצף, על פרופיל בודק.
#
# **למה workflow ולא קריאה ישירה.** אותו נימוק שכתוב ב-`ops-status.yml`: הסוד
# (`ADMIN_TOKEN`) חי ב-secrets של GitHub, וכל מי שצריך אותו רץ כאן. כך אפשר
# להריץ כיול בלי להעביר את הסוד לשום סביבה אחרת — ומי שמפעיל את ההרצה לעולם
# לא רואה אותו.
#
# **למה בכלל.** הפרומפטים של המסלול הם הידית שמושכים כשהתוצאה לא טובה, וכל
# משיכה כזו דורשת מדידה: להריץ את אותם סיפורים בדיוק, ולהשוות `askedRatios`
# מול `drawnRatio` ביומן. עד כה זה נעשה ידנית באתר — עשרים דקות של קליקים
# לכל סבב, ובלי אחידות בין הסבבים. הסיפורים כאן הם ברירת מחדל **בכוונה**:
# השוואה בין שני סבבים שווה משהו רק אם הקלט זהה.
#
# **המסלול זהה למה שלקוחה עוברת** — אותן קריאות API בדיוק, יצירת עיצוב ואז
# `/api/generate` עם `mode: "story"`. אין כאן צינור שני שצריך להישאר תואם;
# ההבדל היחיד הוא הפרופיל שהעיצוב נרשם עליו.
#
# ⚠ **זה עולה כסף אמיתי** (~$0.008 להרצת Story, כלומר ~$0.04 לחמישה סיפורים)
# ואוכל מהמכסה היומית של פרופיל הבודק — זו שהקנרית כבר לוקחת ממנה 12 מתוך 50.
# לכן אין כאן `schedule`: זה רץ רק כשמבקשים.

on:
  workflow_dispatch:
    inputs:
      stories:
        description: 'שורה לכל סיפור: "ring|הסיפור" או "bracelet|הסיפור"'
        required: true
        type: string
        # חמשת הסיפורים של סבב 16.8. ברירת מחדל ולא דוגמה: סבב שרץ על קלט
        # אחר אינו ניתן להשוואה מול הקודם, וזו כל מטרת ההרצה.
        default: |
          ring|אהבה ממבט ראשון
          bracelet|חם וקר, שמח ועצוב, סיפור של ניגודיות
          ring|רחב ואווריר, עדין ונושם
          bracelet|צר, צמוד, אינטימי
          bracelet|חד, זוויתי, מנוכר
      note:
        description: "מה מכיילים בסבב הזה (לפלט ההרצה בלבד)"
        required: false
        type: string
        default: ""

jobs:
  story-lab:
    runs-on: ubuntu-latest
    # חמישה סיפורים × עד ~7 דקות, ועוד מרווח. הרצה שנתקעה עדיף שתיהרג מאשר
    # תחזיק runner שעה.
    timeout-minutes: 45
    steps:
      # הסקריפט חי בריפו, ולכן צריך למשוך אותו. הקנרית שלצידה לא עושה זאת כי
      # היא כולה `curl` בתוך ה-YAML — וזה בדיוק ההבדל שהפיל את ההרצה הראשונה.
      - uses: actions/checkout@v4

      - name: Run the story pipeline on a tester profile
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aperta-designs.com' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          STORIES: ${{ inputs.stories }}
          NOTE: ${{ inputs.note }}
        # פייתון ולא bash: הקלט הוא טקסט חופשי בעברית שנכנס ל-JSON, ועוגייה
        # שצריכה לשרוד בין הקריאות. ז'ונגלרי ציטוטים סביב `curl` הוא בדיוק
        # המקום שבו סיפור עם גרש שובר הרצה שעולה כסף.
        run: python3 .github/scripts/story_lab.py
